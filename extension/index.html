<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Margin · PDF Annotator</title>
  <link rel="icon" href="assets/icon-32.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header id="file-bar" class="topbar">
    <div class="brand"><img src="assets/mark.svg" width="35" height="35" alt=""><span>Margin</span></div>
    <div class="file-info"><strong id="filename">PDF workspace</strong><small id="save-state" role="status"><i></i><span>Opening document…</span></small></div>
    <div class="file-actions">
      <button id="open" class="button" data-icon="open">Open PDF</button>
      <button id="export" class="button primary" data-icon="export" disabled>Export PDF</button>
    </div>
    <input id="file" type="file" accept=".pdf,application/pdf" hidden>
  </header>
  <div id="annotation-tools" class="toolbar" role="toolbar" aria-label="Annotation tools">
    <button id="pages-toggle" class="icon-button panel-toggle" data-icon="leftpanel" aria-label="Toggle pages" title="Toggle pages" aria-expanded="true"></button>
    <span class="divider"></span>
    <div class="tool-group">
      <button class="tool active" data-tool="select" data-icon="select" aria-pressed="true" title="Select text (V)">Select</button>
      <button class="tool" data-tool="highlight" data-icon="highlight" aria-pressed="false" title="Highlight text or an area (H)">Highlight</button>
      <button class="tool" data-tool="draw" data-icon="draw" aria-pressed="false" title="Draw freehand (D)">Draw</button>
      <button class="tool" data-tool="note" data-icon="note" aria-pressed="false" title="Add a note (N)">Note</button>
    </div>
    <span class="divider"></span>
    <div class="palette" role="group" aria-label="Annotation color"></div>
    <div class="toolbar-end">
      <button id="undo" class="icon-button" data-icon="undo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled></button>
      <button id="redo" class="icon-button" data-icon="redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled></button>
      <span class="divider"></span>
      <button id="annotations-toggle" class="icon-button panel-toggle" data-icon="rightpanel" aria-label="Toggle annotations" title="Toggle annotations" aria-expanded="true"></button>
    </div>
  </div>
  <main id="workspace">
    <aside id="pages-panel" aria-labelledby="pages-heading">
      <div class="panel-heading"><h2 id="pages-heading">Pages</h2><span class="count" id="page-count">0</span></div>
      <nav id="thumbnails" aria-label="Document pages"></nav>
    </aside>
    <section id="stage" aria-label="PDF viewer">
      <div id="scroller" tabindex="0" aria-label="PDF pages">
        <div id="sheets" data-tool="select" data-layout="single"></div>
      </div>
    </section>
    <aside id="annotations-panel" aria-labelledby="annotations-heading">
      <div class="panel-heading"><h2 id="annotations-heading">Annotations</h2><span class="count" id="annotation-count">0</span><button class="appearance-link" type="button" data-note-appearance aria-haspopup="dialog">Note appearance</button></div>
      <div class="filters">
      <div class="filter-wrap"><label for="filter" class="sr-only">Filter annotations by page</label>
        <select id="filter"><option value="all">All pages</option><option value="current">Current page</option></select><span data-icon="down"></span>
      </div>
      <div class="filter-wrap" id="action-filter-wrap" hidden><label for="action-filter" class="sr-only">Filter by action status</label>
        <select id="action-filter"><option value="all">All annotations</option><option value="todo">To do</option><option value="done">Done</option></select><span data-icon="down"></span>
      </div>
      </div>
      <div id="cards"></div>
      <div class="annotation-files" role="group" aria-label="Annotation files">
        <button id="import-annotations" class="button" disabled>Import annotations</button>
        <button id="export-annotations" class="button" disabled>Export annotations</button>
        <input id="annotation-file" type="file" accept=".json,application/json" hidden>
      </div>
    </aside>
  </main>
  <footer>
    <span class="local-status" data-icon="lock">Local workspace</span>
    <div class="view-controls">
      <div class="page-nav" role="group" aria-label="Page navigation">
        <button id="prev" class="icon-button" data-icon="prev" aria-label="Previous page" disabled></button>
        <span>Page <b id="current">–</b> of <span id="total">–</span></span>
        <button id="next" class="icon-button" data-icon="next" aria-label="Next page" disabled></button>
      </div>
      <span class="divider"></span>
      <div class="zoom" role="group" aria-label="PDF zoom">
        <button class="icon-button" id="zoom-out" data-icon="minus" aria-label="Zoom out" title="Zoom out (−)" disabled></button>
        <output id="zoom-value" aria-label="PDF zoom level">–</output>
        <button class="icon-button" id="zoom-in" data-icon="plus" aria-label="Zoom in" title="Zoom in (+)" disabled></button>
        <button class="icon-button" id="fit" data-icon="fit" aria-label="Fit to width" title="Fit to width (0)" disabled></button>
      </div>
      <span class="divider"></span>
      <select id="page-layout" aria-label="Page layout" title="Page layout">
        <option value="single">Single page</option>
        <option value="continuous">Continuous scrolling</option>
      </select>
    </div>
    <div class="view-actions">
      <button id="workspace-toggle" class="text-button" data-icon="leftpanel" aria-expanded="true" aria-controls="file-bar annotation-tools pages-panel annotations-panel"><span>Hide workspace</span></button>
      <button id="shortcuts" class="text-button" data-icon="keys" aria-label="Shortcuts" title="Shortcuts"><span>Shortcuts</span></button>
    </div>
  </footer>
  <dialog id="note-dialog" aria-labelledby="note-title">
    <form id="note-form">
      <div class="dialog-head"><h2 id="note-title">Add a note</h2><button class="icon-button" type="button" data-close data-icon="close" aria-label="Close"></button></div>
      <div class="note-label"><label for="note-text">Note</label><button class="appearance-link" type="button" data-note-appearance aria-haspopup="dialog">Note appearance</button></div>
      <textarea id="note-text" rows="10" required maxlength="12000" placeholder="Write your note…" autofocus></textarea>
      <div class="note-checks">
        <label class="check-label"><input type="checkbox" id="track-note"> Track as action</label>
        <label class="check-label" id="note-done-label" hidden><input type="checkbox" id="note-done"> Done</label>
      </div>
      <div class="dialog-actions"><button class="button" type="button" data-close>Cancel</button><button class="button primary" type="submit">Save note</button></div>
    </form>
  </dialog>
  <dialog id="appearance-dialog" aria-labelledby="appearance-title">
    <form id="appearance-form" method="dialog">
      <div class="dialog-head"><h2 id="appearance-title">Note appearance</h2><button class="icon-button" type="button" data-close data-icon="close" aria-label="Close"></button></div>
      <div class="appearance-controls">
        <div><label for="note-font">Font</label><select id="note-font"><option value="sans" selected>Sans serif</option><option value="serif">Serif</option><option value="mono">Monospace</option></select></div>
        <div><label for="note-size">Text size</label><select id="note-size"><option value="14">14 px</option><option value="16">16 px</option><option value="18" selected>18 px</option><option value="20">20 px</option><option value="24">24 px</option><option value="28">28 px</option><option value="32">32 px</option></select></div>
        <div><label for="note-box">Box size</label><select id="note-box"><option value="compact">Compact</option><option value="comfortable" selected>Comfortable</option><option value="spacious">Spacious</option></select></div>
      </div>
      <p id="appearance-example" aria-label="Note preview"></p>
      <div class="dialog-actions"><button id="reset-appearance" type="button" class="button">Restore defaults</button><button class="button primary">Done</button></div>
    </form>
  </dialog>
  <div id="note-preview" role="tooltip" hidden></div>
  <dialog id="keys-dialog" aria-labelledby="keys-title">
    <div class="dialog-head"><h2 id="keys-title">Keyboard shortcuts</h2><button class="icon-button" data-close data-icon="close" aria-label="Close"></button></div>
    <dl id="key-list"></dl>
  </dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
