name: Test extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - name: Prepare the installable ZIP for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          display_version=$(node -p "const m = require('./dist/manifest.json'); m.version_name ?? m.version")
          test "$version" = "$display_version"
          test "$GITHUB_REF_NAME" = "v$version"
          mkdir -p "$RUNNER_TEMP/package"
          cp -R dist "$RUNNER_TEMP/package/Margin"
          cd "$RUNNER_TEMP/package"
          zip -qr "$GITHUB_WORKSPACE/margin-pdf-annotator.zip" Margin
          unzip -q "$GITHUB_WORKSPACE/margin-pdf-annotator.zip" -d "$RUNNER_TEMP/install-check"
          echo "MARGIN_EXTENSION_DIR=$RUNNER_TEMP/install-check/Margin" >> "$GITHUB_ENV"
      - run: npm run test:browser
        env:
          MARGIN_PREVIEW_PATH: ${{ github.workspace }}/margin-editor.png
          MARGIN_NOTE_PREVIEW_PATH: ${{ github.workspace }}/margin-note-appearance.png
          MARGIN_PALETTE_PREVIEW_PATH: ${{ github.workspace }}/margin-palette.png
      - name: Save the README preview for review before tagging
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: editor-preview
          path: |
            margin-editor.png
            margin-note-appearance.png
            margin-palette.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: tested-release
          path: |
            margin-pdf-annotator.zip
            margin-editor.png
          if-no-files-found: error
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tested-release
      - name: Publish the tested ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" margin-pdf-annotator.zip "${release_flags[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Margin ${GITHUB_REF_NAME#v}" \
            --notes "Open HTTP and HTTPS links from Markdown notes in a new tab. Exported PDFs include the label and copyable web address, and annotation exports keep the editable Markdown. This candidate also includes LaTeX equations from RC1. Download **margin-pdf-annotator.zip** under **Assets**, extract it, and load the **Margin** folder. [Add a web link]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#open-a-web-link-from-a-note) · [Install Margin]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#install-margin) · [Update Margin]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#update-margin)."
